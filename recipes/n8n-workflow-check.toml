name = "n8n Workflow Check"
description = "Diagnosi tecnica completa di workflow n8n: trigger, nodi, espressioni, webhook, credenziali, retry, errori, duplicati ed esecuzioni."
agent = "ge360_n8n_engineer"
model = "gpt-5.6-luna"
risk = "low"
prompt = """
Agisci come n8n Engineer. Analizza il workflow indicato partendo dall'esecuzione o dal workflow JSON reale. Individua il primo nodo che fallisce, verifica input/output, espressioni, credenziali come riferimenti sicuri, webhook test/production, retry, error handling e prevenzione duplicati. Non stampare segreti. Fai un checkpoint/export prima di modificare, applica la patch minima e verifica almeno il percorso principale e il percorso d'errore rilevante.
"""
